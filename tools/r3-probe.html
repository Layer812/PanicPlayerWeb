<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Panic Player Web — R3 startup verification</title>
<style>html{color-scheme:dark;font-family:system-ui,sans-serif;background:#101010;color:#eee}
main{max-width:880px;margin:2rem auto;padding:1rem}h1{font-size:2rem}p{font-size:1.15rem;line-height:1.6}
input,button{font-size:1.1rem;padding:.65rem}pre{white-space:pre-wrap;word-break:break-word;font-size:1rem;
background:#222;padding:1.5rem;border:1px solid #555}a{color:#fff}</style></head>
<body><main><h1>PANIC.X R3 起動トレース</h1>
<p>開発者向け確認ページです。PANIC.X V1.38の実行開始から最初のDOS呼び出しまで、実コード7命令だけをWebAssemblyで検証します。映像や音声の再生はできません。</p>
<p>ファイルは端末内だけで読み込み、送信しません。PANIC.Xは配布物に同梱していません。</p>
<label>ローカルの PANIC.X を指定 <input id="file" type="file" accept=".x"></label>
<pre id="out" role="status" aria-live="polite">PANIC.X を選択してください。</pre>
<p><a href="../index.html">PANICファイラーへ戻る</a></p></main>
<script type="module">
const output=document.getElementById('out');
let worker=null;
document.getElementById('file').addEventListener('change',e=>{
  const file=e.target.files?.[0];if(!file)return;
  worker?.terminate();worker=new Worker('./r3-probe-worker.mjs',{type:'module'});
  output.textContent='検証中';
  worker.onmessage=({data})=>{output.textContent=data.ok?JSON.stringify(data.result,null,2):
    'STOP (not validated): '+(data.error??JSON.stringify(data.result));worker.terminate();worker=null;};
  worker.onerror=()=>{output.textContent='Worker failed. Use localhost HTTP server and modern browser.';worker?.terminate();worker=null;};
  worker.postMessage({type:'boot',file});
});
</script></body></html>
